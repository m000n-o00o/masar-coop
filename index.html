<title>مسار التعاوني</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a transit-line metaphor. The co-op journey is one line with stations;
   the header is a station sign, countdowns are departure boards. */
:root{
  --bg:#F3F6F5;          /* paper, slight green bias */
  --surface:#FFFFFF;
  --ink:#0F1F1B;         /* text */
  --muted:#5A6B66;
  --line:#D5DFDC;        /* hairlines */
  --accent:#0B7A63;      /* the line colour */
  --accent-soft:#DDEFEA;
  --signal:#B97800;      /* deadlines / soon */
  --signal-soft:#F8ECD3;
  --danger:#B3261E;
  --done:#0B7A63;
  --good:#1E7F3C;
  --good-soft:#DFF1E3;
  --font-display:"Reem Kufi", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --font-data:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --surface:#15201D; --ink:#E6EEEB; --muted:#9AADA7; --line:#26332F;
    --accent:#3CC3A0; --accent-soft:#16332C; --signal:#E3AA3A; --signal-soft:#3A2E14;
    --danger:#F08A80; --done:#3CC3A0; --good:#6BCB82; --good-soft:#18331F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#15201D; --ink:#E6EEEB; --muted:#9AADA7; --line:#26332F;
  --accent:#3CC3A0; --accent-soft:#16332C; --signal:#E3AA3A; --signal-soft:#3A2E14;
  --danger:#F08A80; --done:#3CC3A0; --good:#6BCB82; --good-soft:#18331F; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4.5vw,2.8rem)}
h2{font-size:1.6rem}
h3{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header = station sign */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .dot{width:28px;height:28px;border-radius:50%;border:5px solid var(--accent);background:var(--surface)}
.brand b{font-family:var(--font-display);font-size:1.3rem}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;font-weight:500;font-size:.95rem}
nav.tabs a:hover{color:var(--ink);background:var(--accent-soft)}
nav.tabs a[aria-current="page"]{color:var(--surface);background:var(--accent)}
.theme-btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted);font-size:.85rem}

main{padding-block:32px 64px}
section.view{display:grid;gap:28px}
section.view > *,.sec > *{min-width:0}
.lede{color:var(--muted);max-width:62ch}
.eyebrow{font-size:.8rem;letter-spacing:.06em;color:var(--accent);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;text-decoration:none;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{border-color:var(--line);background:transparent;color:var(--muted);font-weight:500}
.btn.danger{border-color:var(--danger);background:transparent;color:var(--danger)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.signal{background:var(--signal-soft);color:var(--signal)}
.tag.example{background:transparent;border:1px dashed var(--muted);color:var(--muted)}

/* home hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:stretch}
.hero > *{min-width:0}
.hero-text{display:grid;gap:14px;align-content:center}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

/* departure board */
.board{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:18px 20px;display:grid;gap:10px;align-content:start}
.board .lbl{font-size:.8rem;opacity:.75}
.board .what{font-family:var(--font-display);font-size:1.25rem}
.board .digits{font-size:2.4rem}
.digits,.t-count{display:flex;gap:14px;align-items:flex-start}
.u{display:grid;justify-items:center;gap:2px}
.u b{font-family:var(--font-data);font-variant-numeric:tabular-nums;font-weight:600;line-height:1}
.u small{font-family:var(--font-body);font-size:.75rem;opacity:.75;font-weight:500}
.board .empty{opacity:.8}
.board a{color:var(--bg)}

/* transit line */
.line{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding-top:8px}
.line::before{content:"";position:absolute;top:22px;right:8%;left:8%;height:6px;background:var(--line);border-radius:3px}
.line .fill{position:absolute;top:22px;right:8%;height:6px;background:var(--accent);border-radius:3px;transition:width .4s}
.stn{position:relative;display:grid;justify-items:center;gap:6px;text-align:center;text-decoration:none;color:var(--ink);padding:0 4px}
.stn .ring{width:34px;height:34px;border-radius:50%;background:var(--surface);border:5px solid var(--line);display:grid;place-items:center;font-family:var(--font-data);font-size:.75rem;z-index:1}
.stn.started .ring{border-color:var(--accent)}
.stn.done .ring{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.stn .nm{font-weight:600;font-size:.9rem;line-height:1.35}
.stn .pc{font-family:var(--font-data);font-size:.75rem;color:var(--muted)}
@media (max-width:640px){
  .line{grid-template-columns:1fr;gap:14px;padding-right:0}
  .line::before{top:10px;bottom:10px;right:16px;left:auto;width:6px;height:auto}
  .line .fill{display:none}
  .stn{grid-template-columns:auto 1fr auto;justify-items:start;text-align:right;align-items:center;gap:12px}
}

/* cards grid for sections */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px;text-decoration:none;color:var(--ink);align-content:start}
.card:hover{border-color:var(--accent)}
.card .meta{color:var(--muted);font-size:.9rem}

/* journey stages */
.stage{display:grid;grid-template-columns:56px 1fr;gap:16px}
.stage > *{min-width:0}
.stage .rail{display:grid;justify-items:center;grid-template-rows:auto 1fr}
.stage .rail .ring{width:40px;height:40px;border-radius:50%;border:6px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--font-data);font-weight:600;font-size:.85rem}
.stage .rail .bar{width:6px;background:var(--line);margin-top:4px;border-radius:3px}
.stage.done .rail .ring{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.stage.started .rail .ring{border-color:var(--accent)}
.stage.done .rail .bar{background:var(--accent)}
.stage-body{padding-bottom:26px;display:grid;gap:10px}
.stage-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.when{font-size:.85rem;color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;max-width:320px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
ul.checks{list-style:none;margin:0;padding:0;display:grid;gap:2px}
ul.checks label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:8px;cursor:pointer}
ul.checks label:hover{background:var(--accent-soft)}
ul.checks input{width:18px;height:18px;margin-top:4px;accent-color:var(--accent)}
ul.checks input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
ul.checks .go{font-size:.85rem;margin-inline-start:6px}

/* countdowns */
.tform{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.tform label{display:grid;gap:4px;font-size:.88rem;color:var(--muted);font-weight:500}
.tform input,.tform select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.hijri{font-size:.8rem;color:var(--muted);min-height:1.2em}
.timers{display:grid;gap:12px}
.timer{display:grid;grid-template-columns:1fr auto;gap:8px 16px;background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--accent);border-radius:var(--r);padding:14px 16px}
.timer > *{min-width:0}
.timer.soon{border-inline-start-color:var(--signal)}
.timer.past{border-inline-start-color:var(--line);opacity:.75}
.timer .t-title{font-weight:600;font-size:1.05rem}
.timer .t-sub{color:var(--muted);font-size:.88rem}
.timer .t-count{font-size:1.5rem;align-self:center}
.timer .t-count small{color:var(--muted)}
.timer .t-actions{grid-column:1 / -1;display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem}
.timer .t-actions button{background:none;border:none;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline}
.timer .t-actions a{text-decoration:underline}
@media (max-width:520px){.timer{grid-template-columns:1fr}}
.train{display:grid;gap:8px}
.train .progress{max-width:none;height:10px}
.train .ends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);flex-wrap:wrap;gap:8px}

/* placeholder sections */
.soon-list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.soon-list li{padding:12px 14px;border:1px dashed var(--line);border-radius:8px;background:var(--surface)}
.soon-list li b{display:block}
.soon-list li span{color:var(--muted);font-size:.92rem}
.note{font-size:.9rem;color:var(--muted);border-inline-start:3px solid var(--signal);padding-inline-start:12px}

footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:.88rem}
footer .wrap{display:grid;gap:6px}
.foot-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.credits{font-size:.8rem;color:var(--muted)}
.credits a{color:var(--muted)}
.credit-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.credit-list div{display:grid;gap:2px;padding-inline-start:12px;border-inline-start:3px solid var(--accent)}
.credit-list b{font-family:var(--font-display);font-size:1.1rem;font-weight:700}
.credit-list span{color:var(--muted);font-size:.9rem}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.9rem;z-index:20}
.inline-confirm{display:inline-flex;gap:8px;align-items:center}

/* apply */
.subnav{display:flex;gap:8px;flex-wrap:wrap}
.subnav a{font-size:.9rem;padding:4px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);background:var(--surface)}
.subnav a:hover{border-color:var(--accent)}
.sec{display:grid;gap:16px}
#sec-email{padding-top:20px;border-top:1px solid var(--line)}
.segtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.segtabs button{display:grid;gap:2px;text-align:start;border:0;background:transparent;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.segtabs button b{font-size:1rem}
.segtabs button span{font-size:.8rem;color:var(--muted)}
.segtabs button:hover{background:var(--accent-soft)}
.segtabs button[aria-selected="true"]{background:var(--accent);color:var(--surface)}
.segtabs button[aria-selected="true"] span{color:var(--surface);opacity:.85}
@media (max-width:520px){.segtabs button span{display:none}.segtabs button{text-align:center}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.88rem;color:var(--ink)}
.chip b{font-family:var(--font-data);font-weight:600;margin-inline-start:4px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:var(--bg)}
.sum{cursor:pointer;font-weight:600;color:var(--accent)}
.apps{display:grid;gap:10px}
.app{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--line);border-radius:var(--r);padding:14px 16px}
.app > *{min-width:0}
.app.signal{border-inline-start-color:var(--signal)}
.app.good{border-inline-start-color:var(--good)}
.app.bad{border-inline-start-color:var(--danger)}
.app.muted{opacity:.7}
.app-main{display:grid;gap:4px}
.app .meta{color:var(--muted);font-size:.9rem}
.app-notes{font-size:.92rem}
.app-status select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-weight:600}
.app .t-actions{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem}
.app .t-actions button{background:none;border:none;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline}
@media (max-width:520px){.app{grid-template-columns:1fr}}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:.9rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chip.good{} .tag.good{background:var(--good-soft);color:var(--good)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:2px 12px}
ol.steps li::before{content:counter(s);grid-row:span 2;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center;font-family:var(--font-data);font-size:.8rem;font-weight:600}
ol.steps b{font-weight:600}
ol.steps span{color:var(--muted);font-size:.93rem}
code{font-family:var(--font-data);font-size:.85em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.code{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.code-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--font-data);font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.code pre{margin:0;padding:14px;max-height:340px;overflow:auto;font-family:var(--font-data);font-size:.8rem;line-height:1.55;text-align:left;white-space:pre}
.dir{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.dir .panel{display:grid;gap:10px}
ul.links{list-style:none;margin:0;padding:0;display:grid}
ul.links li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
ul.links li:first-child{border-top:0}
ul.links a{font-weight:600}
ul.links span{color:var(--muted);font-size:.85rem;unicode-bidi:plaintext}

/* cv */
.callout{display:grid;gap:6px;border-inline-start:4px solid var(--accent)}
.cvsecs{display:grid;gap:8px}
.cvsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.cvsec.key{border-color:var(--signal)}
.cvsec summary{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;list-style:none}
.cvsec summary::-webkit-details-marker{display:none}
.cvsec summary::after{content:"+";margin-inline-start:auto;font-family:var(--font-data);color:var(--muted);font-size:1.2rem}
.cvsec[open] summary::after{content:"−"}
.cvsec .num{width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center;font-family:var(--font-data);font-size:.8rem;font-weight:600;flex:none}
.cvsec .nm{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cvsec .nm span{color:var(--muted);font-size:.9rem}
.cvsec-body{display:grid;gap:14px;padding:0 16px 16px}
.yesno{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.yesno > *{min-width:0}
.yesno h4{margin:0 0 4px;font-size:.9rem;color:var(--good)}
.yesno div:last-child h4{color:var(--danger)}
.yesno ul{margin:0;padding-inline-start:18px;display:grid;gap:2px;font-size:.93rem}
@media (max-width:600px){.yesno{grid-template-columns:1fr}}
.example{border:1px dashed var(--line);border-radius:8px;overflow:hidden}
.example-lbl{display:block;font-size:.75rem;color:var(--muted);padding:4px 10px;border-bottom:1px dashed var(--line)}
.example pre,.ptext{margin:0;padding:12px;overflow-x:auto;font-family:var(--font-data);font-size:.8rem;line-height:1.6;white-space:pre;text-align:left;background:var(--bg)}
.ptext{white-space:pre-wrap;font-family:var(--font-body);font-size:.88rem;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.ptext[dir="rtl"]{text-align:right}
.formula{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:600}
.formula span{background:var(--accent-soft);color:var(--accent);padding:4px 12px;border-radius:999px}
.pairs{display:grid;gap:10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.pair > div{padding:12px 14px;display:grid;gap:6px;align-content:start;justify-items:start;min-width:0}
.pair .weak{border-inline-end:1px solid var(--line)}
.pair .weak p{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--danger)}
.pair p{text-align:start;font-size:.92rem}
@media (max-width:600px){.pair{grid-template-columns:1fr}.pair .weak{border-inline-end:0;border-bottom:1px solid var(--line)}}
.tag.bad{background:var(--signal-soft);color:var(--danger)}
.tag.world{background:var(--signal-soft);color:var(--signal)}
.verbs{display:flex;flex-wrap:wrap;gap:6px}
.verbs span{font-family:var(--font-data);font-size:.82rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface)}
.prompts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.prompt{display:grid;gap:10px;align-content:start}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:3px 12px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
ul.links.rich li{align-items:flex-start}
ul.links.rich li > div{display:grid;gap:2px;flex:1;min-width:200px}
ul.links.rich p{color:var(--muted);font-size:.9rem}
ul.links.rich{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px}
ul.checks.panel{padding:8px}
ul.mistakes{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
ul.mistakes li{padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--danger);font-size:.93rem}

/* linkedin */
.segtabs.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:640px){.segtabs.four{grid-template-columns:repeat(2,1fr)}}
.cvsec.done .num{background:var(--accent);color:var(--surface)}
.donebox{display:inline-flex;gap:8px;align-items:center;font-weight:600;cursor:pointer;justify-self:start;padding:6px 12px;border:1px solid var(--line);border-radius:8px}
.donebox input{width:18px;height:18px;accent-color:var(--accent)}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daypick label{cursor:pointer}

<script type="text/plain" id="p-create-ar">
أنت كاتب سير ذاتية محترف وخبير توظيف، تعرف ما الذي يبحث عنه من يفرز السير الذاتية في سوق العمل السعودي.

أنا طالب جامعي، وأريد سيرة ذاتية بالإنجليزية في صفحة واحدة أتقدم بها على التدريب التعاوني ووظائف بداية المسار.

ابدأ برسالة واحدة تجمع فيها كل ما تحتاجه مني دفعة واحدة: بياناتي وطرق التواصل والروابط، دراستي، خبراتي إن وجدت، مشاريعي، مهاراتي، أنشطتي وتطوعي، دوراتي، لغاتي. اطرح الأسئلة كلها مرة واحدة حتى أجاوب عليها في رد واحد.

بعد ردي، اكتب السيرة كاملة، ورتّب الأقسام وصغ المحتوى بما تراه أنسب لحالتي - إن لم تكن لدي خبرة عملية فاجعل المشاريع في المقدمة.

التزم بما يلي:
- الناتج كله بالإنجليزية ويدخل في صفحة واحدة.
- نص بسيط يقرأه نظام الـ ATS: بلا جداول ولا أعمدة ولا أيقونات ولا صورة شخصية.
- لا تخترع أي خبرة أو مهارة أو مشروع أو رقم لم أذكره لك. ما ينقصك اسألني عنه.
- ابنِ كل نقطة على فعل ونتيجة، لا على صفات عامة مثل hard worker.

وبعد أن تكتبها، اذكر لي أضعف ثلاث نقاط فيها وكيف أقويها.
</script>
<script type="text/plain" id="p-create-en">
You are a professional CV writer and recruiter who knows what resume screeners in the Saudi job market look for.

I am a university student, and I want a one-page CV in English to apply for Co-op training and entry-level roles.

Start with a single message collecting everything you need from me at once: my details and contact information and links, my education, my experience if any, my projects, my skills, my activities and volunteering, my courses, my languages. Ask all of it in one go so I can answer in one reply.

After my reply, write the full CV, and order the sections and phrase the content in whatever way fits my case best - if I have no work experience, lead with the projects.

Follow these rules:
- The entire output is in English and fits on one page.
- Plain text an ATS can read: no tables, no columns, no icons, no photo.
- Never invent any experience, skill, project or number I did not give you. Ask me about anything missing.
- Build every bullet on a verb and a result, not on generic adjectives like "hard worker".

Once it is written, tell me its three weakest points and how to strengthen them.
</script>
<script type="text/plain" id="p-improve-ar">
أنت كاتب سير ذاتية محترف وخبير توظيف، تعرف ما الذي يبحث عنه من يفرز السير الذاتية في سوق العمل السعودي.

أنا طالب جامعي، وهذه سيرتي الذاتية الحالية. أريد تحسينها لأتقدم بها على التدريب التعاوني ووظائف بداية المسار، والناتج يكون بالإنجليزية في صفحة واحدة.

[الصق سيرتك هنا أو أرفق الملف]

ابدأ بتقييم صريح: ما أقوى ما فيها، وما أضعف ما فيها، وما الذي سيجعل من يفرزها يتجاوزها. لا تجاملني.

ثم اكتبها من جديد: حسّن الصياغة، واختصر ما يطول، وأعد ترتيب الأقسام إن كان ترتيبها لا يخدمني، واحذف ما لا قيمة له.

التزم بما يلي:
- الناتج كله بالإنجليزية ويدخل في صفحة واحدة.
- نص بسيط يقرأه نظام الـ ATS: بلا جداول ولا أعمدة ولا أيقونات ولا صورة شخصية.
- لا تخترع أي خبرة أو مهارة أو مشروع أو رقم ليس موجودًا في سيرتي. إن احتجت معلومة ناقصة اسألني عنها.
- ابنِ كل نقطة على فعل ونتيجة، لا على صفات عامة مثل hard worker.

وفي الأخير، اذكر لي قائمة بما غيّرته ولماذا، واسألني إن كنت أريد نسخة مخصصة لإعلان وظيفة معيّن.
</script>
<script type="text/plain" id="p-improve-en">
You are a professional CV writer and recruiter who knows what resume screeners in the Saudi job market look for.

I am a university student, and this is my current CV. I want to improve it so I can apply for Co-op training and entry-level roles, with the output in English on one page.

[Paste your CV here or attach the file]

Start with an honest assessment: what is strongest in it, what is weakest, and what would make a screener pass over it. Do not flatter me.

Then rewrite it: improve the wording, cut whatever runs long, reorder the sections if the current order does not serve me, and remove anything that adds no value.

Follow these rules:
- The entire output is in English and fits on one page.
- Plain text an ATS can read: no tables, no columns, no icons, no photo.
- Never invent any experience, skill, project or number that is not in my CV. If you need something that is missing, ask me for it.
- Build every bullet on a verb and a result, not on generic adjectives like "hard worker".

At the end, list what you changed and why, then ask me whether I want a version tailored to a specific job posting.

[], "text": "بدأت التدريب بمزيج من الحماس والقلق، لكن مع الوقت اكتشفت أن أجمل ما فيه هو الانتقال من المعرفة النظرية إلى التطبيق الحقيقي. تعلمت أدوات ومهارات جديدة، واجهت تحديات، وتعرّفت أكثر على نقاط قوتي والمجال الذي أطمح للاستمرار فيه.\n\nنصيحتي لكل طالب مقبل على التدريب: لا تتوقع أنك تعرف كل شيء، ادخل بعقلية المتعلم، اسأل، جرّب، واستفد من كل مهمة مهما بدت بسيطة. اجعل التدريب فرصة حقيقية لتطوير نفسك، وليس مجرد متطلب للتخرج."}]}, {"id": 12, "name": "سارا", "major": "علم بيانات", "branch": "الزاهر", "batch": "45", "grad": false, "org": "مؤشرات", "mode": "مدمج (حضوري و عن بعد) /البيئة منفصلة", "how": "الجهة أعلنت و سجلت بالفورم", "gpa": "لا", "benefit": "استفدت بشكل كبير", "pressure": "ضغط متوسط ومتوازن", "pay": "نعم (1000﷼ تقريبًا)", "diff": "أصعب قليلاً", "links": [], "sections": [{"t": "إجراءات التقديم", "items": [["كيف قدمت", "الجهة أعلنت و سجلت بالفورم"], ["خطوات الإجراء", "لجنة التدريب اعلنت عن فورم مقدم من الجهة فيه المعلومات المعروفة مثل السيرة الذاتية وهي اكثر ما يركزون عليه"], ["الجهة", "مؤشرات (مدمج (حضوري و عن بعد) /البيئة منفصلة)"], ["هل توصي بالجهة؟", "نعم. الجهة تعاملك كأنك موظف، تتلقى مهام بشكل دوري ويؤخذ برأيك وبعض الأحيان تمسك مشروع كامل لحالك.\nويوجد تواصل واجتماعيات يومية وأسبوعية لمراجعة العمل والمشاكل.\nالتجربة تساعدك تفهم بيئات العمل، وكيف تُستخدم البيانات في سوق العمل، وتكوّن خبرة وثقة بمهاراتك السابقة وتتعلم مهارات جديدة."], ["هل تشترط الجهة معدل عالي؟", "لا"]], "text": ""}, {"t": "الجانب النفسي", "items": [["هل استفدت فعليًا؟", "استفدت بشكل كبير"], ["الشعور من البداية للنهاية", "بالبداية توتر وجهل تام بطريقة العمل والـworkflow؛\nلكن الجهة أعطتنا اسبوعين تجهيزية مع المشرف والي عطانا فيها الأساسيات.\nبعد ذلك أعطتنا تاسك حقيقي خلانا نفهم البيانات اللي عندهم بشكل كبير وشالت كم كبير من الغموض."], ["مستوى الضغط", "ضغط متوسط ومتوازن"]], "text": ""}, {"t": "المهام والمشروع", "items": [["المهام المنفذة", "كتابة مرئيات وملاحظات بناءً على البيانات\nصنع تقارير تشغيلية\nبناء نماذج تسهل وتقلل من العمل اليدوي\nهيكلة وبناء داشبوردات"], ["هل تختلف المهام بين الأشخاص؟", "أغلبنا داتا وفقط واحد علوم حاسب، والمهام ما اختلفت بيننا لأن طالب العلوم كان توجهه داتا."], ["صعوبة التاسكات مقارنة بالجامعة", "أصعب قليلاً"], ["المشروع", "نعم، غير إلزامي، بحسب ما يتوفر من تاسكات ومشاكل بحاجة لحلول ومشاريع متعمقة."], ["أكبر تحدٍّ", "تعلم التواصل مع الإدارة ومدير الفريق إذا كان من الصعب تنفيذ مهمة أو يوجد اختلاف آراء في طريقة التنفيذ.\nموازنة الضغط في موسم الحج."]], "text": ""}, {"t": "التقرير النهائي", "items": [], "text": "المهام المنفذة بدءًا من كيف نشئت إلى كيف تعاملت معها والنتائج النهائية وأثرها على العمل. بالإضافة إلى التحديات الشخصية والحلول."}, {"t": "الجوانب الإدارية", "items": [["مكافأة مالية", "نعم (1000﷼ تقريبًا)"], ["عدد الجهات", "جهة واحدة"], ["إكمال العقد", "كاملة. مسموح."], ["خطأ ينصح بتجنبه", "اجتهد ولكن وازن بين الراحة والعمل، أنت متدرب بالأخير فلا تجهد نفسك فوق طاقتك.\nتواصل مع الموظفين واثبت نفسك ومهاراتك.\nخذ أي أوراق مطلوب توقعها الجهة نهاية الفترة التدريبية قبل ما تطلع، لأنهم راح ينسونك ويلطعونك لو تركتهم على راحتهم."]], "text": ""}, {"t": "ملخص التجربة", "items": [], "text": "التدريب جزء مهم من مسيرتك المهنية، يوضح لك أمور ويصحح لك توقعات مسبقة ويخليك ترتب أهدافك بثقة أكبر. \nإذا لم تستطع التدرب مع جهة جيدة فلا بأس، لا تضيع الوقت وابدأ في متابعة دورات وعمل مشاريع شخصية، وتذكر أن فرصة التوظيف الموسمي هي قائمة وفرصة رائعة لاكتساب الخبرات والمهارات تعوض عمّا لم تجده في التدريب.\nاجتهد، فهذه أولى الخطوات التي تكوّن مستقبلك المهني، أعطي أحسن ما عندك، وتأمّل خيرًا، وفقك الله لما يحب ويرضى."}]}, {"id": 13, "name": "", "major": "علم بيانات", "branch": "الزاهر", "batch": "45", "grad": false, "org": "وزارة الحج والعمرة - مركز تحليل البيانات وذكاء الأعمال.", "mode": "حضوري بالكامل /البيئة مختلطة", "how": "عن طريق ترشيح من الجامعة", "gpa": "لا", "benefit": "استفدت بشكل متوسط", "pressure": "مريح جدًا / ريلاكس", "pay": "لا", "diff": "مشابهة تقريبًا", "links": [], "sections": [{"t": "إجراءات التقديم", "items": [["كيف قدمت", "عن طريق ترشيح من الجامعة"], ["خطوات الإجراء", "تواصلت معي إحدى دكاترة القسم لتقوم بترشيحي بناءً على طلب أحد معارفها بالجهة أن ترشح لهم طلبة من القسم.\nقامت هي بالتواصل مع الجهة وتم القبول."], ["الجهة", "وزارة الحج والعمرة - مركز تحليل البيانات وذكاء الأعمال.  (حضوري بالكامل /البيئة مختلطة)"], ["هل توصي بالجهة؟", "يعتمد على فترة التدريب + المشرف.\nفي حالتي , فترة التدريب كانت من شعبان الى ما بعد موسم الحج, التدريب مقبول في غير موسم الحج لكن مع بدأ الموسم وانشغالهم يتم اهمال التدريب بل وقد لا تتوافر مكاتب ويحولوكم للعمل عن بعد (طبعا لا يوجد تاسكات بحسب انشغالهم لذا تقريبا تكون اجازة اكثر من كونها عن بعد).\n\nأما بخصوص المشرف, مشرفتنا كانت متخصصة بنفس تخصصنا, لذا استفدت بعض الشيء من خلال المحاورة والنقاشات معها. لكن البعض مع مشرفين اخرين كانوا يعانون من عدم ارتباط التاسكات بمستوى تخصصهم نهائيًا لذا اقول انه يعتمد على المشرف.\n\nكانطباع عام, هناك جهات افضل بالتأكيد, لكن في حال عدم توافر فرص فيهم, بالامكان اللجوء للوزارة كحل بديل عوضًا عن الجهات اللتي يقال انها لا تعطي ابدا اي مهام وما إلى ذلك. لأنه على الاقل ستغطي متطلبات التدريب بالاضافة الى بيئة مريحة إلى حد ما, أما فائدة حقيقة تنعكس على مهاراتك وتُثري معرفتك؟ لا أظن."], ["هل تشترط الجهة معدل عالي؟", "لا"]], "text": ""}, {"t": "الجانب النفسي", "items": [["هل استفدت فعليًا؟", "استفدت بشكل متوسط"], ["الشعور من البداية للنهاية", "بناءً على سمعة الجهة من الدفعة السابقة, شعرت بالاحباط خوفًا من تشابه تجربتي مع خاصتهم.\nمع ذلك, بعد ان انتهيت والحمد لله, لم يكن بذاك السوء ولا بتلك الفائدة, مجرد تغطية متطلبات التدريب + تطوير بعض المهارات الناعمة (soft skills) من حيث تجربة التحدث والتعامل مع الموظفين."], ["مستوى الضغط", "مريح جدًا / ريلاكس"]], "text": ""}, {"t": "المهام والمشروع", "items": [["المهام المنفذة", "مهمة تحليل بيانات متكاملة وإنشاء داشبورد لها - طبعًا البيانات من مصادر مفتوحة ولا علاقة بها بالوزارة, نفس المهمة مرة بالاكسل ومرة ببيانات اخرى على الباور بي اي.\n\nتصنيف بيانات شكاوي واستفسارات الحج خاصة بهم (تقريبا البيانات الوحيدة التي سمحوا لنا باستخدامها)\n\nانشاء قاعدة بيانات مصغرة للحج والعمرة (البيانات طلب منا توليدها بـ python faker)\n\nبناء ai assistant خاص لقاعدة البيانات السابقة."], ["هل تختلف المهام بين الأشخاص؟", "بالنسبة لنا كنا نقوم بنفس المهام"], ["صعوبة التاسكات مقارنة بالجامعة", "مشابهة تقريبًا"], ["المشروع", "لا يوجد"], ["أكبر تحدٍّ", "التاسكات رغم ارتباطها بالتخصص إلا انها ليست بتلك الفائدة"]], "text": ""}, {"t": "التقرير النهائي", "items": [], "text": "المهام بالتفصيل + التحديات والانطباع عن تجربة التدريب"}, {"t": "الجوانب الإدارية", "items": [["مكافأة مالية", "لا"], ["عدد الجهات", "جهة واحدة"], ["إكمال العقد", "اعتقد يعتمد على المشرف, نحن وقعنا في البداية كما طلبت اللجنة حيث قالوا المدة هي الترم الثاني + الصيفي ,, لذا وقعنا حتى عشرينات أغسطس ,, وبعد ان عدلوا شروطهم -اللجنة- وقالوا لابأس بانهاء التدريب لمن اكمل 23 اسبوع تواصلنا مع المشرفة برغبتنا في الانتهاء على بداية يوليو, وقبلت ذلك."], ["خطأ ينصح بتجنبه", "لا يحضرني شيء, فالقصور في تدريبنا كان من الجهة حيث انهم يرفضون اعطاءنا مهام تتعلق ببياناتهم الحقيقية, لذا كانت المشرفة تعطينا مهام بديله ببيانات مفتوحة وما الى ذلك."]], "text": ""}, {"t": "ملخص التجربة", "items": [], "text": "استمع لتجارب سابقيك لكن لا تعتمد وتبني عليها, ففي حالتي مع الوزارة, تجربة احد طلاب الدفعة السابقة كانت سيئة للغاية, تجربتي؟ أراها مقبولة, ليست بذاك السوء وليست الافضل.\nوأخيرًا إن لم تحصل على جهةٍ كنت تريدها, ماذا في ذَلك؟ اعتبرها تجربة دوام مكتبيّ + تعلم التحاور والتعامل مع موظفين, اما جانبك المهني والتقني؟ تطويره يبدأ منك, استغل الفرصة لتطوير نفسك بنفسك في حال سلاسة وسهولة المهمات او اهمال جهة التدريب لك (في احد المواسم كالحج مثلا ’-’)\nاسألُ الله لكم كل التوفيق والتيسير في تدريبكم, واستمتعوا بالفترةِ حُلوةً كانت او سَيئة..."}]}, {"id": 5, "name": "امل الشريف", "major": "علوم حاسب", "branch": "الزاهر", "batch": "45", "grad": true, "org": "وادي مكة", "mode": "حضوري بالكامل /البيئة مختلطة", "how": "الاثنين معًا", "gpa": "لا", "benefit": "استفدت بشكل كبير", "pressure": "ضغط متوسط ومتوازن", "pay": "لا", "diff": "أصعب قليلاً", "links": [], "sections": [{"t": "إجراءات التقديم", "items": [["كيف قدمت", "الاثنين معًا"], ["خطوات الإجراء", "اول شي طبعت الcv وقدمت بعدين راسلتهم برضو ايميل وهم اقبلوني من تقديمي اليدوي"], ["الجهة", "وادي مكة (حضوري <script type="text/plain" id="gasCode">
/**
 * Co-op Email Tracker (Google Apps Script)
 * Scans your Gmail for co-op / internship emails, guesses the status
 * (offer, rejection, interview, received), and logs each one to this Google Sheet.
 * Everything runs inside your own Google account. Nothing is sent anywhere else.
 *
 * Setup:
 * 1. Create a new Google Sheet.
 * 2. Extensions > Apps Script, delete the sample code, paste this file, save.
 * 3. Choose the "setup" function and press Run, then approve the permissions.
 *    It scans the last DAYS_BACK days and installs a daily automatic scan.
 */

const CONFIG = {
  SHEET_NAME: 'Applications',
  DAYS_BACK: 180,            // how far back the first scan looks
  RUN_HOUR: 7,               // daily scan hour (your account's time zone)
  LABEL: 'Co-op',            // Gmail label added to matched threads ('' to disable)
  // Gmail search. Edit freely: add company names or remove words that bring noise.
  QUERY: '(internship OR intern OR "co-op" OR coop OR "cooperative training" OR trainee OR ' +
         '"تدريب تعاوني" OR "التدريب التعاوني" OR "تدريب صيفي" OR "برنامج تدريب") ' +
         '-category:promotions -category:social -in:sent',
};

// Checked in this order: the first match decides the status.
const RULES = [
  { status: 'قبول', words: ['congratulations', 'pleased to offer', 'offer letter', 'we are pleased to inform',
      'you have been selected', 'you have been accepted', 'مبروك', 'تهانينا', 'تم قبولك', 'يسعدنا إبلاغك', 'خطاب القبول'] },
  { status: 'رفض', words: ['unfortunately', 'regret to inform', 'not been selected', 'not to move forward',
      'other candidates', 'will not be progressing', 'نأسف', 'نعتذر', 'لم يتم اختيارك', 'لم يتم قبول', 'عدم قبول'] },
  { status: 'مقابلة', words: ['invite you to an interview', 'invitation to interview', 'interview invitation',
      'schedule your interview', 'schedule an interview', 'online assessment', 'hackerrank', 'codility', 'shortlisted',
      'دعوة لمقابلة', 'موعد المقابلة', 'موعد مقابلة', 'اختبار إلكتروني', 'تم ترشيحك'] },
  { status: 'تم الاستلام', words: ['received your application', 'thank you for applying', 'thank you for your application',
      'application has been submitted', 'تم استلام', 'شكرا لتقديمك', 'شكراً لتقديمك', 'تم تقديم طلبك'] },
  // Anything else that still looks application-related, so nothing slips through unlogged.
  { status: 'تحديث', words: ['application', 'interview', 'candidate', 'طلبك', 'مقابلة', 'المتقدم'] },
];

const HEADERS = ['Date', 'Company', 'Status', 'Subject', 'From', 'Link', 'MessageId'];

function setup() {
  getSheet_();
  ScriptApp.getProjectTriggers()
    .filter(t => t.getHandlerFunction() === 'scanInbox')
    .forEach(t => ScriptApp.deleteTrigger(t));
  ScriptApp.newTrigger('scanInbox').timeBased().everyDays(1).atHour(CONFIG.RUN_HOUR).create();
  scanInbox();
}

function scanInbox() {
  const sheet = getSheet_();
  const seen = new Set(
    sheet.getLastRow() > 1
      ? sheet.getRange(2, 7, sheet.getLastRow() - 1, 1).getValues().map(r => String(r[0]))
      : []
  );
  const label = CONFIG.LABEL ? (GmailApp.getUserLabelByName(CONFIG.LABEL) || GmailApp.createLabel(CONFIG.LABEL)) : null;
  const query = CONFIG.QUERY + ' newer_than:' + CONFIG.DAYS_BACK + 'd';
  const rows = [];

  for (let start = 0; start < 500; start += 100) {
    const threads = GmailApp.search(query, start, 100);
    if (!threads.length) break;
    threads.forEach(thread => {
      thread.getMessages().forEach(msg => {
        const id = msg.getId();
        if (seen.has(id)) return;
        const subject = msg.getSubject() || '';
        const text = (subject + ' ' + msg.getPlainBody().slice(0, 4000)).toLowerCase();
        const status = classify_(text);
        if (!status) return;   // matched the search but looks unrelated to an application
        rows.push([msg.getDate(), company_(msg.getFrom()), status, subject, msg.getFrom(),
                   'https://mail.google.com/mail/u/0/#all/' + thread.getId(), id]);
        seen.add(id);
      });
      if (label) thread.addLabel(label);
    });
  }

  if (rows.length) {
    rows.sort((a, b) => a[0] - b[0]);
    sheet.getRange(sheet.getLastRow() + 1, 1, rows.length, HEADERS.length).setValues(rows);
  }
}

function classify_(text) {
  for (const rule of RULES) {
    if (rule.words.some(w => text.indexOf(w.toLowerCase()) !== -1)) return rule.status;
  }
  return '';
}

// "Talent Team at Acme <careers@acme.com>" -> "Talent Team at Acme";
// falls back to the sender's domain when there is no display name.
function company_(from) {
  const m = from.match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>/);
  const name = m ? m[1].trim() : '';
  const email = m ? m[2] : from;
  const domain = (email.split('@')[1] || '').replace(/^(mail|email|jobs|careers|hr|no-?reply)\./, '');
  const generic = /(gmail|outlook|hotmail|yahoo|icloud|myworkday|workday|successfactors|greenhouse|lever|taleo|smartrecruiters)\./i;
  if (name) return name;
  return generic.test(domain) ? email : domain.split('.')[0];
}

function getSheet_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const sheet = ss.getSheetByName(CONFIG.SHEET_NAME) || ss.insertSheet(CONFIG.SHEET_NAME);
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(HEADERS);
    sheet.setFrozenRows(1);
    sheet.getRange('A:A').setNumberFormat('yyyy-mm-dd');
  }
  return sheet;
}
</script>

if(!state)state={checks:{},timers:[],seedV:2};
state.checks=state.checks||{};state.timers=state.timers||[];
if(state.seedV!==2){const keep1=(arr)=>{let seen=false;return (arr||[]).filter(x=>{if(!x.example)return true;if(seen)return false;seen=true;return true})};state.timers=keep1(state.timers);if(state.apps)state.apps=keep1(state.apps);state.seedV=2}

function addTimer(t){state.timers=state.timers.filter(x=>!x.example);state.timers.push(t)}

function diffParts(ms){
  const s=Math.max(0,Math.floor(Math.abs(ms)/1000));
  return{d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60};
}
const pad=n=>String(n).padStart(2,"0");
function countHTML(ms){
  if(ms<=0)return'<span style="font-size:1rem">انتهى</span>';
  const p=diffParts(ms);
  const u=(n,l)=>`<span class="u"><b>${n}</b><small>${l}</small></span>`;
  return u(p.d,"يوم")+u(pad(p.h),"ساعة")+u(pad(p.m),"دقيقة")+u(pad(p.s),"ثانية");
}
function sortedTimers(){
  const now=Date.now();
  return [...state.timers].sort((a,b)=>{
    const ta=new Date(a.at)-now,tb=new Date(b.at)-now;
    if((ta<0)!==(tb<0))return ta<0?1:-1;
    return ta<0?tb-ta:ta-tb;
  });
}
function gcalLink(t){
  const d=new Date(t.at),e=new Date(d.getTime()+60*60*1000);
  const f=x=>x.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const q=new URLSearchParams({action:"TEMPLATE",text:t.title,dates:f(d)+"/"+f(e),details:(TYPES[t.type]||"")+(t.org?" - "+t.org:"")+"\nمن مسار التعاوني"});
  return "https://calendar.google.com/calendar/render?"+q.toString();
}
function trainingWindow(){
  const s=state.timers.find(t=>t.type==="start"),e=state.timers.find(t=>t.type==="end");
  if(!s||!e)return null;
  const a=new Date(s.at),b=new Date(e.at);if(b<=a)return null;
  const now=Date.now();
  const pct=Math.min(100,Math.max(0,(now-a)/(b-a)*100));
  const weeks=Math.round((b-a)/(7*864e5));
  return{a,b,pct,weeks,example:s.example||e.example};
}

function guessCourse(url){
  let u;try{u=new URL(url.trim())}catch(e){return null}
  const host=u.hostname.replace(/^www\./,"");
  const plat=(PLATFORMS.find(([d])=>host.includes(d))||[null,host.split(".")[0]])[1];
  const skip=/^(learn|courses?|course|specializations?|professional-certificates|projects|paths?|tracks?|training|watch|playlist|en|ar|ar-sa|en-us|browse|programs?|details|p|c|v)$/i;
  const segs=u.pathname.split("/").map(decodeURIComponent).filter(x=>x&&!skip.test(x)&&!/^\d+$/.test(x)&&!/^[a-f0-9-]{16,}$/i.test(x));
  let name=segs.length?segs[segs.length-1]:"";
  name=name.replace(/\.(html?|php)$/,"").replace(/[-_]+/g," ").trim();
  if(name)name=name.replace(/\b[a-z]/g,c=>c.toUpperCase());
  return{name:name||plat,plat,url:u.href};
}
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function studyGrid(){
  const today=new Date();today.setHours(0,0,0,0);
  const s=state.timers.find(t=>t.type==="start"&&!t.example);
  let end=new Date(today);end.setDate(end.getDate()+7*8);
  if(s){const sd=new Date(s.at);sd.setHours(0,0,0,0);if(sd>today)end=sd}
  let start=new Date(today);start.setDate(start.getDate()-7*26);
  start.setDate(start.getDate()-start.getDay());
  const weeks=[];const d=new Date(start);
  while(d<=end){const col=[];for(let i=0;i<7;i++){col.push(new Date(d));d.setDate(d.getDate()+1)}weeks.push(col)}
  return{weeks,today,end,hasStart:!!s};
}

  let streak=0;const d=new Date();d.setHours(0,0,0,0);
  if(!state.study[dkey(d)])d.setDate(d.getDate()-1);
  while(state.study[dkey(d)]>0){streak++;d.setDate(d.getDate()-1)}
  const wk=new Date();wk.setHours(0,0,0,0);wk.setDate(wk.getDate()-wk.getDay());
  let thisWeek=0;for(let i=0;i<7;i++){const x=new Date(wk);x.setDate(wk.getDate()+i);if(state.study[dkey(x)]>0)thisWeek++}
  return{days:keys.length,streak,thisWeek};
}

function expChips(x){
  const c=[];
  if(x.mode)c.push(x.mode.startsWith("مدمج")?"مدمج":x.mode.startsWith("عن بعد")?"عن بعد":"حضوري");
  if(x.pay){if(x.pay.startsWith("نعم")){const m=x.pay.match(/\(([^)]*\d[^)]*)\)/);c.push("مكافأة"+(m?": "+m[1].replace(/\s*تقريبًا/,"").trim()+" تقريبًا":""))}else c.push("بدون مكافأة")}
  if(x.pressure)c.push(x.pressure.includes("مريح")?"ضغط مريح":x.pressure.includes("كبير")?"ضغط كبير":"ضغط متوسط");
  if(x.gpa)c.push(x.gpa.startsWith("نعم")?"يشترط معدل عالي":"ما يشترط معدل عالي");
  return c;
}
function expBody(x){
  return x.sections.map(s=>{
    const items=s.items.filter(([k,v])=>v&&!/^[-—.x]+$/i.test(v.trim()));
    const text=s.text&&!/^[-—.x]+$/i.test(s.text.trim())?s.text:"";
    if(!items.length&&!text)return "";
    return `<div class="xsec"><h4>${esc(s.t)}</h4>${items.length?`<dl>${items.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${linkify(v)}</dd></div>`).join("")}</dl>`:""}${text?`<p>${linkify(text)}</p>`:""}</div>`;
  }).join("");
}

      const note=subject?"من الإيميل ("+date+"): "+subject:"";
      if(hit){
        if(status)hit.status=status;
        if(note&&!(hit.notes||"").includes(subject||"\u0000"))hit.notes=(hit.notes?hit.notes+" | ":"")+note;
        up++;
      }else{
        addApp({id:uid(),org:company,role:"",status:status||"applied",applied:/^\d{4}-\d{2}-\d{2}/.test(date)?date.slice(0,10):"",link:"",notes:note});
        add++;
      }
    });
    save();render(true);toast("حُدّثت "+up+" وأُضيفت "+add);
  });
  $("#wform").addEventListener("submit",e=>{
    e.preventDefault();const org=$("#w-org").value.trim(),month=$("#w-month").value;if(!org||!month)return;
    state.watch.push({id:uid(),org,month,where:$("#w-where").value.trim()});save();render(true);toast("أُضيفت للمراقبة");
  });
  document.querySelectorAll("[data-wtimer]").forEach(b=>b.addEventListener("click",()=>{
    const w=state.watch.find(x=>x.id===b.dataset.wtimer);if(!w)return;
    let d=new Date(w.month+"-01T09:00");while(d<new Date())d.setFullYear(d.getFullYear()+1);
    addTimer({id:uid(),type:"other",title:"يفتح التقديم المتوقع: "+w.org,org:w.org,at:d.toISOString()});save();toast("أُضيف لمواعيدك");
  }));
}
function armDelete(sel,key,fn){
  document.querySelectorAll(sel).forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.armed){fn(b.dataset[key]);save();render(true);return}
    b.dataset.armed="1";b.textContent="أكّد الحذف";b.style.color="var(--danger)";
    setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="حذف";b.style.color=""}},3000);
  }));
}

/* ---------- router ---------- */
const ORDER=["home","journey","experiences","courses","cv","linkedin","apply"];
function fromHash(){let h="";try{h=(location.hash||"").slice(1)}catch(e){}if(h==="timers")return "home";return ORDER.includes(h)?h:null}
let view=fromHash()||"home";
function current(){return view}
function go(v){
  let anchor=null;if(v==="timers"){v="home";anchor="timers-sec"}
  if(!ORDER.includes(v))return;
  view=v;render(false);window.scrollTo(0,0);
  if(anchor){const el=document.getElementById(anchor);if(el)el.scrollIntoView({block:"start"})}
  try{if(location.hash!=="#"+v)location.hash=v}catch(e){}
}
/* Handle in-page navigation ourselves: some embedded viewers do not fire hashchange for #links. */
document.addEventListener("click",e=>{
  const a=e.target.closest&&e.target.closest("a[href^='#']");
  if(!a||a.dataset.jump)return;
  const v=a.getAttribute("href").slice(1);
  if(!ORDER.includes(v)&&v!=="timers")return;
  e.preventDefault();go(v);
});
function render(keepScroll){
  const v=current();
  const y=window.scrollY;
  $("#app").innerHTML=views[v]();
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.getAttribute("href")==="#"+v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  const fc=document.getElementById("footCredits");if(fc)fc.hidden=v!=="home";
  if(keepScroll)window.scrollTo(0,y);
  bind(v);
}
window.addEventListener("hashchange",()=>{const v=fromHash();if(v&&v!==view){view=v;render(false);window.scrollTo(0,0)}});

/* ---------- bindings ---------- */
function bind(v){
  if(v==="apply")bindApply();
  if(v==="cv")bindCv();
  if(v==="experiences")bindExperiences();
  if(v==="courses")bindCourses();
  if(v==="linkedin")bindLinkedin();
  if(v==="journey"){
    document.querySelectorAll("[data-check]").forEach(cb=>cb.addEventListener("change",()=>{
      if(cb.checked)state.checks[cb.dataset.check]=true;else delete state.checks[cb.dataset.check];
      save();render(true);
    }));
  }
  if(v==="home"){
    document.querySelectorAll("[data-donestep]").forEach(b=>b.addEventListener("click",()=>{state.checks[b.dataset.donestep]=true;save();render(true);toast("تمام، هذي الجاية")}));
    const tg=$("#toggleTimers");if(tg)tg.addEventListener("click",()=>{showAllTimers=!showAllTimers;render(true)});
    const dateIn=$("#t-date"),hj=$("#t-hijri");
    dateIn.addEventListener("input",()=>{if(!dateIn.value){hj.textContent="";return}const d=new Date(dateIn.value+"T12:00");hj.textContent=hijri(d)?hijri(d)+" هـ":""});
    $("#t-type").addEventListener("change",e=>{const t=$("#t-title");if(!t.value&&e.target.value!=="other")t.value=TYPES[e.target.value]});
    $("#tform").addEventListener("submit",e=>{
      e.preventDefault();
      const date=dateIn.value,time=$("#t-time").value||"09:00",title=$("#t-title").value.trim();
      if(!date||!title)return;
      addTimer({id:uid(),type:$("#t-type").value,title,org:$("#t-org").value.trim(),at:new Date(date+"T"+time).toISOString()});
      save();render(true);toast("أُضيف الموعد");
    });
    document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
      if(b.dataset.armed){state.timers=state.timers.filter(t=>t.id!==b.dataset.del);save();render(true);return}
      b.dataset.armed="1";b.textContent="أكّد الحذف";b.style.color="var(--danger)";
      setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="حذف";b.style.color=""}},3000);
    }));
    const ce=$("#clearEx");if(ce)ce.addEventListener("click",()=>{state.timers=state.timers.filter(t=>!t.example);save();render(true)});
    $("#copyBackup").addEventListener("click",()=>{
      const txt=JSON.stringify(state);
      const box=$("#restoreBox");
      const manual=()=>{box.value=txt;box.select();toast("حدد النص وانسخه يدويًا")};
      try{navigator.clipboard.writeText(txt).then(()=>toast("انتسخت النسخة الاحتياطية"),manual)}catch(e){manual()}
    });
    $("#restoreBtn").addEventListener("click",()=>{
      try{const s=JSON.parse($("#restoreBox").value);if(!s||!Array.isArray(s.timers))throw 0;state=Object.assign({checks:{},timers:[],apps:[],watch:[]},s);save();render(true);toast("رجعت بياناتك")}
      catch(e){toast("النص هذا مو نسخة احتياطية صحيحة. انسخه كامل وجرب مرة ثانية")}
    });
  }
}

/* live ticking */
setInterval(()=>{document.querySelectorAll("[data-at]").forEach(el=>{el.innerHTML=countHTML(new Date(el.dataset.at)-Date.now())})},1000);

$("#themeBtn").addEventListener("click",()=>{
  const nx=curTheme()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",nx);try{localStorage.setItem(KEY+".theme",nx)}catch(e){}themeLabel();
});
try{const t=localStorage.getItem(KEY+".theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
themeLabel();
